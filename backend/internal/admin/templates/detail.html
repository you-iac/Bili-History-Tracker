<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - Bili History Tracker</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 2rem auto; padding: 0 1.2rem; max-width: 1100px; color: #1f2328; background: #f6f8fa; }
  h1 { font-size: 1.3rem; margin-bottom: .1rem; }
  h2 { font-size: 1rem; margin: 1.6rem 0 .5rem; }
  .sub { color: #57606a; margin-top: 0; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1rem; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; }
  dt { color: #57606a; font-size: .85rem; }
  dd { margin: 0; font-size: .9rem; word-break: break-all; }
  pre { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; overflow: auto; font-size: .78rem; line-height: 1.45; }
  a { color: #1f6feb; }
</style>
</head>
<body>
<h1>{{.Title}}</h1>
<p class="sub">{{.Subtitle}}</p>
<dl>
  {{range .Meta}}
  <dt>{{index . 0}}</dt>
  <dd>{{index . 1}}</dd>
  {{end}}
</dl>

<h2>最新版本 payload（完整上游 data）</h2>
<pre>{{.Payload}}</pre>

<p><a href="/">返回后台</a></p>
</body>
</html>
